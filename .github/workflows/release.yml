# Release: build dist/lovearound_<version>_all.deb and publish it as the
# GitHub release v<version> (publish.sh). Started by hand from the Actions tab
# ("Run workflow") or `gh workflow run release -R lovearound-me/linux`; the
# version is 0.2.<commit count>, so release after the commits are in.
name: Release
on: workflow_dispatch
permissions:
  contents: write
concurrency: release
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version is the commit count
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-cairo python3-gi python3-gi-cairo \
            python3-cryptography gir1.2-gtk-3.0 gir1.2-soup-3.0 gir1.2-secret-1 gir1.2-gtklayershell-0.1 lintian
      - name: Check
        run: |
          python3 i18n/check.py
          python3 -m unittest discover -s tests -t .
      - name: Build
        run: ./build.sh
      - name: Publish
        run: ./publish.sh
        env:
          GH_TOKEN: ${{ github.token }}
